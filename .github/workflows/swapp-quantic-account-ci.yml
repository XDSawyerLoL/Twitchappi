name: Quantic ID SWAPP Account Security
on:
  pull_request:
    paths:
      - 'modules/swapp-quantic-account-auth.js'
      - 'modules/swapp-quantic-id-presence.js'
      - 'assets/swapp-quantic-id-site.js'
      - 'assets/swapp-quantic-login-keeper.js'
      - 'modules/swapp-page-shell.js'
      - 'index.html'
      - 'server.js'
      - 'test/swapp-quantic-account-login.test.js'
      - 'test/swapp-quantic-id-site.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/swapp-quantic-account-ci.yml'
      - 'tools/swapp-quantic-ci-baseline.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies exactly as Hostinger will use them
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Syntax and package guards
        run: |
          npm run check
          node --check modules/swapp-quantic-account-auth.js
          node --check assets/swapp-quantic-login-keeper.js
          node --check assets/swapp-quantic-id-site.js
          npm ls express express-session mysql2 express-rate-limit websocket-driver --all
      - name: Full signed account authentication and cross-feature regression
        run: |
          node --test test/swapp-quantic-account-login.test.js test/swapp-quantic-id-site.test.js
      - name: Compare full SWAPP regression with existing master baseline
        shell: bash
        run: |
          # Existing SWAPP master has historical non-Quantic test failures.
          # Fail this PR if it adds ANY NEW failing test.
          node --test test/*.test.js > "$RUNNER_TEMP/quantic-branch.tap" 2>&1 || true
          git fetch --no-tags origin master --depth=1
          git worktree add --detach "$RUNNER_TEMP/swapp-baseline" FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/swapp-baseline/node_modules"
          (
            cd "$RUNNER_TEMP/swapp-baseline"
            node --test test/*.test.js > "$RUNNER_TEMP/quantic-baseline.tap" 2>&1 || true
          )
          node tools/swapp-quantic-ci-baseline.mjs "$RUNNER_TEMP/quantic-baseline.tap" "$RUNNER_TEMP/quantic-branch.tap"

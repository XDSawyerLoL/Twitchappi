name: SWAPP quality gate
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feat/swapp-premium-ice-black-20261114
      - feat/swapp-live-revalidation-20261113
      - feat/swapp-home-account-appearance-motion-20261114
      - feat/swapp-unified-spa-home-20261114
      - feat/swapp-spa-persistent-nav-20261114
      - fix/swapp-home-remove-legacy-news-duplicates-20261114
concurrency:
  group: swapp-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks (no dependency install)
        run: |
          node --check server.js
          node --check index_script.js
          node --check app.js
          node --check modules/swapp-seo.js
          node --check modules/swapp-news/game-identity.js
          node --check assets/swapp-game-identity.js
          node --check assets/swapp-social-native/views.js
          node --check assets/swapp-program.js
          node --check assets/swapp-tv-rotation.js
          node --check modules/swapp-program.js
          node --check modules/swapp-tv-queue.js
          node --check modules/swapp-tv-director.js
          node --check modules/swapp-page-shell.js
          node --check modules/swapp-catalogue-spa.js
          node --check assets/swapp-catalogue-spa.js
          node --check assets/swapp-home-news.js
          node --check modules/swapp-news/site-shell.js
          node --check assets/swapp-route-motion.js
          node --check assets/swapp-nav-session.js
          node --check modules/swapp-catalogue-lab.js
          node --check assets/swapp-navigation.js
          node --check assets/swapp-hub-nav.js
          node --check assets/swapp-catalogue-lab.js
          node --check assets/swapp-actus-app.js
          node --check modules/swapp-discord-connect.js
          node --check assets/swapp-discord-connect.js
          node --check assets/swapp-account-menu.js
          node --check assets/swapp-account-discord-link.js
          node --check assets/swapp-tv-broadcast.js
          node --check assets/swapp-tv-twitch-player.js
          node --check assets/swapp-creator-social-shortcuts.js
          node --check assets/swapp-article-extras.js
          node --check modules/swapp-news/share-preview.js
          node --check modules/swapp-news/native-pages.js
          node --check modules/swapp-news/router.js
      - name: Editorial, SOCIAL and game-identity regression tests (Node built-ins only)
        run: |
          node --test test/swapp-seo-landings.test.js test/swapp-social-rss-images.test.js test/witcher-remastered-creator-workspace.test.js test/swapp-program.test.js test/swapp-tv-broadcast.test.js test/swapp-tv-five-minute-bar-20261113.test.js test/swapp-tv-live-first-autostart-20261113.test.js test/swapp-live-revalidation-20261113.test.js test/swapp-tv-twitch-player-events-20261113.test.js test/swapp-account-discord-tv-arrival-20261113.test.js test/swapp-tv-rotation.test.js test/swapp-tv-queue.test.js test/swapp-tv-director.test.js test/swapp-home-promotion-small-actus-20261113.test.js test/swapp-catalogue-article-rail-20261113.test.js test/swapp-catalogue-cinema-20261113.test.js test/swapp-nav-catalogue-share-20261113.test.js test/swapp-flat-navigation-20261113.test.js test/swapp-unified-navigation.test.js test/swapp-route-motion.test.js test/swapp-shared-shell-transitions-20261113.test.js test/swapp-native-account-appearance-20261114.test.js test/swapp-spa-home-unification-20261114.test.js test/swapp-premium-ice-theme-20261114.test.js test/swapp-home-no-legacy-duplicate-20261114.test.js test/swapp-tv-nav-theme.test.js test/swapp-nav-dedup.test.js test/swapp-mobile-nav-compact.test.js test/swapp-ux-consolidation.test.js test/swapp-direct-x-preview-20261113.test.js test/swapp-discord-connect-20261113.test.js test/swapp-visible-bell-creator-social.test.js test/swapp-editor-media-seo.test.js

      - name: Préparer le paquet Hostinger à partir du commit GitHub validé
        run: node tools/swapp-hostinger-package.js --output="${{ runner.temp }}/swapp-hostinger-${GITHUB_SHA:0:12}.zip"
      - name: Télécharger le paquet Hostinger vérifié
        uses: actions/upload-artifact@v4
        with:
          name: swapp-hostinger-${{ github.sha }}
          path: ${{ runner.temp }}/swapp-hostinger-*.zip
          if-no-files-found: error
          retention-days: 7

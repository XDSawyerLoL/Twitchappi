name: SWAPP quality gate
on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - feat/swapp-movix-true-visual-20261115
      - security/swapp-moderate-cves-20261115
      - feat/swapp-home-live-top-games-genre-rails-20261114
    paths:
      - 'assets/swapp-nav-utility.*'
      - 'assets/swapp-catalogue-lab.js'
      - 'assets/swapp-home-news.js'
      - 'modules/swapp-page-shell.js'
      - 'index.html'
      - 'test/swapp-nav-utility.test.js'
      - '.github/workflows/swapp-quality.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'server.js'
      - 'test/swapp-proxy-addr-security.test.js'
      - 'test/swapp-websocket-driver-security.test.js'
      - 'test/swapp-high-security-batch-20261114.test.js'
      - 'test/swapp-moderate-cve-security-20261115.test.js'
      - 'assets/swapp-genre-discovery.*'
      - 'assets/swapp-catalogue-spa.js'
      - 'modules/swapp-catalogue-spa.js'
      - 'modules/swapp-catalogue-lab.js'
      - 'test/swapp-home-genres-20261114.test.js'
      - 'test/swapp-top-games-genre-rails-20261114.test.js'
      - 'test/swapp-movix-visual-20261115.test.js'
      - 'test/swapp-global-spotlight-full-genres-20261114.test.js'
  push:
    branches:
      - master
      - security/swapp-high-cves-batch-20261114
      - feat/swapp-home-discover-genres-20261114
      - feat/swapp-home-all-genres-global-spotlight-20261114
      - fix/swapp-websocket-driver-cve-2026-54466
      - feat/swapp-nav-search-news-badge-20261114
      - fix/swapp-hero-rail-footer-streamer-bio-20261114
      - feat/swapp-neutral-smoked-glass-20261114
      - feat/swapp-film-navigation-refinement-20261114
      - feat/swapp-cinematic-navigation-20261114
      - feat/swapp-premium-ice-black-20261114
      - feat/swapp-live-revalidation-20261113
      - feat/swapp-home-account-appearance-motion-20261114
      - feat/swapp-unified-spa-home-20261114
      - feat/swapp-spa-persistent-nav-20261114
      - fix/swapp-home-remove-legacy-news-duplicates-20261114
concurrency:
  group: swapp-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks (no dependency install)
        run: |
          node --check server.js
          node --check index_script.js
          node --check app.js
          node --check modules/swapp-seo.js
          node --check modules/swapp-news/game-identity.js
          node --check assets/swapp-game-identity.js
          node --check assets/swapp-social-native/views.js
          node --check assets/swapp-program.js
          node --check assets/swapp-tv-rotation.js
          node --check modules/swapp-program.js
          node --check modules/swapp-tv-queue.js
          node --check modules/swapp-tv-director.js
          node --check modules/swapp-page-shell.js
          node --check modules/swapp-catalogue-spa.js
          node --check assets/swapp-catalogue-spa.js
          node --check assets/swapp-home-news.js
          node --check modules/swapp-news/site-shell.js
          node --check assets/swapp-route-motion.js
          node --check assets/swapp-nav-session.js
          node --check modules/swapp-catalogue-lab.js
          node --check assets/swapp-navigation.js
          node --check assets/swapp-hub-nav.js
          node --check assets/swapp-catalogue-lab.js
          node --check assets/swapp-actus-app.js
          node --check modules/swapp-discord-connect.js
          node --check assets/swapp-discord-connect.js
          node --check assets/swapp-account-menu.js
          node --check assets/swapp-account-discord-link.js
          node --check assets/swapp-tv-broadcast.js
          node --check assets/swapp-tv-twitch-player.js
          node --check assets/swapp-creator-social-shortcuts.js
          node --check assets/swapp-article-extras.js
          node --check modules/swapp-news/share-preview.js
          node --check modules/swapp-news/native-pages.js
          node --check modules/swapp-news/router.js
      - name: Editorial, SOCIAL and game-identity regression tests (Node built-ins only)
        run: |
          node --test test/swapp-seo-landings.test.js test/swapp-social-rss-images.test.js test/witcher-remastered-creator-workspace.test.js test/swapp-program.test.js test/swapp-tv-broadcast.test.js test/swapp-tv-five-minute-bar-20261113.test.js test/swapp-tv-live-first-autostart-20261113.test.js test/swapp-live-revalidation-20261113.test.js test/swapp-tv-twitch-player-events-20261113.test.js test/swapp-account-discord-tv-arrival-20261113.test.js test/swapp-tv-rotation.test.js test/swapp-tv-queue.test.js test/swapp-tv-director.test.js test/swapp-home-promotion-small-actus-20261113.test.js test/swapp-catalogue-article-rail-20261113.test.js test/swapp-catalogue-layout-bio-20261114.test.js test/swapp-catalogue-cinema-20261113.test.js test/swapp-nav-catalogue-share-20261113.test.js test/swapp-flat-navigation-20261113.test.js test/swapp-unified-navigation.test.js test/swapp-route-motion.test.js test/swapp-cinematic-navigation-20261114.test.js test/swapp-shared-shell-transitions-20261113.test.js test/swapp-native-account-appearance-20261114.test.js test/swapp-spa-home-unification-20261114.test.js test/swapp-premium-ice-theme-20261114.test.js test/swapp-neutral-glass-theme-20261114.test.js test/swapp-home-no-legacy-duplicate-20261114.test.js test/swapp-tv-nav-theme.test.js test/swapp-nav-dedup.test.js test/swapp-mobile-nav-compact.test.js test/swapp-ux-consolidation.test.js test/swapp-direct-x-preview-20261113.test.js test/swapp-discord-connect-20261113.test.js test/swapp-visible-bell-creator-social.test.js test/swapp-editor-media-seo.test.js

      - name: Header search and news notification regression tests
        run: |
          node --check assets/swapp-nav-utility.js
          node --check assets/swapp-catalogue-lab.js
          node --check assets/swapp-home-news.js
          node --test test/swapp-nav-utility.test.js

      - name: Verify pinned proxy-addr 2.0.8 isolated from unrelated dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/swapp-security-deps"
          npm install --prefix "$RUNNER_TEMP/swapp-security-deps" --no-save --ignore-scripts --omit=optional --no-audit --no-fund proxy-addr@2.0.8
          NODE_PATH="$RUNNER_TEMP/swapp-security-deps/node_modules" node --test test/swapp-proxy-addr-security.test.js
          npm ls --prefix "$RUNNER_TEMP/swapp-security-deps" proxy-addr --all

      - name: Unified homepage, genre discovery and cursor spotlight
        run: |
          node --check assets/swapp-genre-discovery.js
          node --check assets/swapp-catalogue-lab.js
          node --check assets/swapp-catalogue-spa.js
          node --test test/swapp-home-genres-20261114.test.js

      - name: Verify patched websocket-driver 0.7.5 and frame-length regression
        run: |
          node --check test/swapp-websocket-driver-security.test.js
          node --test test/swapp-websocket-driver-security.test.js
          mkdir -p "$RUNNER_TEMP/swapp-websocket-security"
          npm install --prefix "$RUNNER_TEMP/swapp-websocket-security" --no-save --ignore-scripts --omit=optional --no-audit --no-fund websocket-driver@0.7.5
          SWAPP_WS_SECURITY_TEST=1 NODE_PATH="$RUNNER_TEMP/swapp-websocket-security/node_modules" node --test test/swapp-websocket-driver-security.test.js
          npm ls --prefix "$RUNNER_TEMP/swapp-websocket-security" websocket-driver --all

      - name: Full genre grid, five-entry navigation and global accent spotlight
        run: |
          node --check assets/swapp-genre-discovery.js
          node --check assets/swapp-nav-utility.js
          node --check assets/swapp-hub-nav.js
          node --check assets/swapp-navigation.js
          node --test test/swapp-global-spotlight-full-genres-20261114.test.js

      - name: Verify all high-CVE security locks and full production runtime
        run: |
          node --check test/swapp-high-security-batch-20261114.test.js
          node --check test/swapp-moderate-cve-security-20261115.test.js
          node --test test/swapp-high-security-batch-20261114.test.js test/swapp-moderate-cve-security-20261115.test.js
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --fetch-retries=1 --fetch-timeout=30000
          SWAPP_DEPENDENCY_RUNTIME_TEST=1 SWAPP_MODERATE_CVE_RUNTIME_TEST=1 node --test test/swapp-high-security-batch-20261114.test.js test/swapp-moderate-cve-security-20261115.test.js
          npm ls --all node-forge qs body-parser @fastify/busboy @grpc/grpc-js engine.io nodemailer socket.io-parser protobufjs fast-xml-builder fast-xml-parser form-data ws uuid

      - name: Real top games, poster rails by genre and responsive Movix-style UI
        run: |
          node --check assets/swapp-genre-discovery.js
          node --check assets/swapp-catalogue-lab.js
          node --check modules/swapp-catalogue-lab.js
          node --test test/swapp-top-games-genre-rails-20261114.test.js

      - name: Screenshot-driven visual contract for the actual SWAPP homepage
        run: |
          node --check assets/swapp-catalogue-lab.js
          node --check modules/swapp-catalogue-lab.js
          node --test test/swapp-movix-visual-20261115.test.js

      - name: Préparer le paquet Hostinger à partir du commit GitHub validé
        run: node tools/swapp-hostinger-package.js --output="${{ runner.temp }}/swapp-hostinger-${GITHUB_SHA:0:12}.zip"
      - name: Télécharger le paquet Hostinger vérifié
        uses: actions/upload-artifact@v4
        with:
          name: swapp-hostinger-${{ github.sha }}
          path: ${{ runner.temp }}/swapp-hostinger-*.zip
          if-no-files-found: error
          retention-days: 7

name: SWAPP quality and deployment parity

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      verify_production:
        description: 'Compare this checkout with the live swapp.tv release AFTER Hostinger deploy'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: swapp-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source checks and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: JavaScript syntax checks
        run: npm run check
      - name: SWAPP automated tests
        run: npm test
      - name: Release fingerprint completeness
        run: npm run release:info

  deployed-parity:
    name: Verify production only when explicitly requested
    if: github.event_name == 'workflow_dispatch' && inputs.verify_production == true
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify swapp.tv is running THIS checkout
        run: npm run verify:production

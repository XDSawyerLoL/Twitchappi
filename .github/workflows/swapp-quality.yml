name: SWAPP quality and deployment parity

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      verify_production:
        description: 'Compare this checkout with the live swapp.tv release AFTER Hostinger deploy'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: swapp-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source checks and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: JavaScript syntax checks
        run: npm run check
      - name: SWAPP automated tests
        run: npm test
      - name: Release fingerprint completeness
        run: npm run release:info

  deployed-parity:
    name: Verify production only when explicitly requested
    if: github.event_name == 'workflow_dispatch' && inputs.verify_production == true
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify swapp.tv is running THIS checkout
        run: npm run verify:production

  mobile-browser:
    name: Chromium mobile SOCIAL smoke after deployment
    if: github.event_name == 'workflow_dispatch' && inputs.verify_production == true
    needs: deployed-parity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for this one-off mobile verification
        run: npm install --no-save --ignore-scripts @playwright/test@1.56.0
      - name: Install Chromium test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise real mobile navigation and search
        run: npx playwright test e2e/swapp-mobile.spec.cjs --reporter=line
      - name: Preserve mobile screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swapp-social-mobile-captures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

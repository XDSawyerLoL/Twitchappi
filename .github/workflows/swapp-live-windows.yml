name: SWAPP Live Windows (free public runner)

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/swapp-live-windows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout SWAPP
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run live transport regression tests
        run: node --test test/swapp-native-webrtc-transport.test.js test/swapp-native-live-public.test.js test/swapp-browser-http-relay.test.js

      - name: Install local SWAPP Live dependencies
        run: npm install --prefix local-agent --no-audit --no-fund

      - name: Compile Windows installer and portable EXE
        run: npm run dist:win --prefix local-agent

      - name: Publish installers as public GitHub Release (not paid Actions artifact storage)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "swapp-live-windows-v1.0.0"
          $files = @(Get-ChildItem "local-agent/dist" -File -Filter "*.exe" | ForEach-Object { $_.FullName })
          if ($files.Count -lt 2) { throw "SWAPP Live installer and portable executable were not both produced" }
          $notes = "SWAPP Live local native OBS connector. Standalone graphical installer / portable EXE, no CMD at runtime. Uses free local FFmpeg and existing SWAPP architecture. Browser streaming works independently via swapp.tv."
          gh release create $tag $files --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "SWAPP Live Windows v1.0.0" --notes $notes

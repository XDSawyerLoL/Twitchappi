name: SWAPP Live Windows (free public runner)

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/swapp-live-windows.yml
      - 'local-agent/**'
      - test/swapp-local-tunnel.test.js
      - test/swapp-browser-http-relay.test.js
      - test/swapp-native-webrtc-transport.test.js
      - test/swapp-native-live-public.test.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout SWAPP
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run live transport regression tests
        run: node --test test/swapp-native-webrtc-transport.test.js test/swapp-native-live-public.test.js test/swapp-browser-http-relay.test.js test/swapp-local-tunnel.test.js

      - name: Install local SWAPP Live dependencies
        run: npm install --prefix local-agent --no-audit --no-fund

      - name: Download and verify bundled Cloudflare Tunnel (official pinned binary)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "local-agent/bin" | Out-Null
          $url = "https://github.com/cloudflare/cloudflared/releases/download/2026.10.2/cloudflared-windows-amd64.exe"
          $dest = "local-agent/bin/cloudflared.exe"
          Invoke-WebRequest -Uri $url -OutFile $dest
          $sha = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "12c7c887f8aaab779aef1dfa9b60673530a5adb88ecc55dd6df8f56e0b70f199") { throw "Cloudflared SHA256 mismatch: $sha" }
          & $dest --version

      - name: Compile Windows installer and portable EXE
        run: npm run dist:win --prefix local-agent

      - name: Publish installers as public GitHub Release (not paid Actions artifact storage)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "swapp-live-windows-v1.0.2"
          $files = @(Get-ChildItem "local-agent/dist" -File -Filter "*.exe" | ForEach-Object { $_.FullName })
          if ($files.Count -lt 2) { throw "SWAPP Live installer and portable executable were not both produced" }
          $notes = "SWAPP Live Windows v1.0.2: OBS stream public player now includes volume slider, mute toggle, fullscreen, and adjustable Fit/Fill controls with no distortion. Autoplay stays muted until explicit user action. Cloudflared and HLS.js bundled, private API isolated. No new paid service or console."
          gh release create $tag $files --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "SWAPP Live Windows v1.0.2" --notes $notes

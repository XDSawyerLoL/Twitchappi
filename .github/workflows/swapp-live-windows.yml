name: SWAPP Live Windows (free public runner)

# The Windows packaging job installs tools and may consume billable
# hosted-runner minutes. It must never run automatically on pushes or merges.
# The maintainer may trigger it manually when an updated installer is needed.
# Creator Studio 1.2.3 Windows picker: corrected escaped filename test and repackaging verified selection.
# Disabled the one-time push trigger after delivery to avoid surprise runner costs.
# All new builds are manual-only to prevent unexpected runner charges.
# A one-time user-authorized push build was run successfully on 2026-11-08;
# automatic push-triggered builds are now disabled to avoid future charges.
on:
  push:
    branches:
      - feat/swapp-live-native-screen-capture-20261108
    paths:
      - '.github/workflows/swapp-live-windows.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish public EXE release after native libobs validation?"
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout SWAPP
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SWAPP Live Windows shipping tests (blocking)
        run: node --test test/swapp-native-desktop-studio.test.js test/swapp-libobs-bridge.test.js test/swapp-libobs-package-gate.test.js test/swapp-studio-dashboard.test.js test/swapp-studio-end-to-end-controls.test.js test/swapp-studio-api-security.test.js test/swapp-window-capture.test.js test/swapp-electron-runtime-package.test.js

      - name: Run full legacy regression suite (report failures without blocking preview build)
        continue-on-error: true
        run: node --test test/swapp-native-webrtc-transport.test.js test/swapp-native-live-public.test.js test/swapp-browser-http-relay.test.js test/swapp-local-tunnel.test.js test/swapp-electron-runtime-package.test.js test/swapp-tunnel-fallback.test.js test/swapp-direct-hls-relay.test.js test/swapp-local-ui-simplify.test.js test/swapp-discord-live-preview.test.js test/swapp-native-obs-quality.test.js test/swapp-ts-inspect.test.js test/swapp-native-desktop-studio.test.js test/swapp-libobs-bridge.test.js test/swapp-libobs-package-gate.test.js

      - name: Show preview build limitations
        run: echo "Preview only - libobs Game Capture is not compiled, remaining legacy test failures are tracked, Windows capture is unverified."

      - name: Report native libobs packaging status
        shell: pwsh
        run: |
          $native = "local-agent/libobs-runtime/swapp-libobs-host.exe"
          if (Test-Path $native) {
            Write-Host "Native libobs host staged, verify GPL notices before release."
          } else {
            Write-Host "Native libobs host is source-only; build will use FFmpeg fallback."
          }

      - name: Install local SWAPP Live dependencies
        run: npm install --prefix local-agent --no-audit --no-fund

      - name: Download and verify bundled Cloudflare Tunnel (official pinned binary)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "local-agent/bin" | Out-Null
          $url = "https://github.com/cloudflare/cloudflared/releases/download/2026.10.2/cloudflared-windows-amd64.exe"
          $dest = "local-agent/bin/cloudflared.exe"
          Invoke-WebRequest -Uri $url -OutFile $dest
          $sha = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "12c7c887f8aaab779aef1dfa9b60673530a5adb88ecc55dd6df8f56e0b70f199") { throw "Cloudflared SHA256 mismatch: $sha" }
          & $dest --version

      - name: Compile Windows installer and portable EXE
        run: npm run dist:win --prefix local-agent

      - name: Verify bundled Windows window picker exists and runs
        shell: pwsh
        run: |
          $script = "local-agent/dist/win-unpacked/resources/app/list-capture-windows.ps1"
          if (!(Test-Path $script)) { throw "Window picker missing from the packaged EXE" }
          $json = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) { throw "Packaged Win32 window enumeration failed" }
          if (!$json) { throw "Win32 window picker must return valid JSON, even when no windows are open" }
          $windows = ConvertFrom-Json -InputObject ($json -join " ")
          if ($null -eq $windows) { throw "Invalid Win32 JSON response" }
          Write-Host "Packaged window enumeration passed"

      - name: Verify Electron DLLs in packaged app and installed NSIS executable
        shell: pwsh
        run: |
          $output = "local-agent/dist/win-unpacked"
          $exe = Join-Path $output "SWAPP Live.exe"
          $dll = Join-Path $output "ffmpeg.dll"
          if (!(Test-Path $exe)) { throw "Critical: SWAPP Live.exe missing from the Windows package" }
          if (!(Test-Path $dll)) { throw "Critical: ffmpeg.dll missing next to SWAPP Live.exe" }
          if ((Get-Item $dll).Length -lt 102400) { throw "Critical: ffmpeg.dll appears truncated" }
          $dllHash = (Get-FileHash $dll -Algorithm SHA256).Hash
          Write-Host "Packaged Electron ffmpeg.dll SHA256: $dllHash"
          $installer = "local-agent/dist/SWAPP-Live-Setup-1.2.3-x64.exe"
          $portable = "local-agent/dist/SWAPP-Live-Portable-1.2.3-x64.exe"
          foreach ($artifact in @($installer, $portable)) {
            if (!(Test-Path $artifact)) { throw "Missing release executable: $artifact" }
          }
          # Test what the user actually receives: install the self-contained NSIS
          # EXE without a terminal or download of a separate runtime dependency.
          $install = Start-Process -FilePath (Resolve-Path $installer) -ArgumentList '/S' -PassThru -WindowStyle Hidden
          if (!$install.WaitForExit(90000)) {
            try { $install.Kill() } catch {}
            throw "NSIS smoke installation did not finish within 90 seconds"
          }
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($install.ExitCode)" }
          $programs = Join-Path $env:LOCALAPPDATA "Programs"
          $installedExe = @(Get-ChildItem -Path $programs -Recurse -File -Filter "SWAPP Live.exe" -ErrorAction SilentlyContinue)
          if ($installedExe.Count -eq 0) { throw "NSIS finished but installed SWAPP Live.exe was not found" }
          $matching = @($installedExe | Where-Object {
            $installedDll = Join-Path $_.DirectoryName "ffmpeg.dll"
            (Test-Path $installedDll) -and ((Get-FileHash $installedDll -Algorithm SHA256).Hash -eq $dllHash)
          })
          if ($matching.Count -eq 0) { throw "NSIS installed SWAPP Live.exe without the matching ffmpeg.dll" }
          Write-Host "NSIS smoke test PASS: matching Electron ffmpeg.dll is installed next to SWAPP Live.exe"

      - name: Upload validated Windows installer and portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: SWAPP-Live-1.2.3-Windows-window-capture-preview
          path: |
            local-agent/dist/SWAPP-Live-Setup-1.2.3-x64.exe
            local-agent/dist/SWAPP-Live-Portable-1.2.3-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish premium Creator Studio as direct Windows EXE pre-release
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "swapp-live-windows-v1.2.3-window-capture-preview"
          $portable = "local-agent/dist/SWAPP-Live-Portable-1.2.3-x64.exe"
          $setup = "local-agent/dist/SWAPP-Live-Setup-1.2.3-x64.exe"
          foreach ($file in @($portable, $setup)) {
            if (!(Test-Path $file)) { throw "Missing binary: $file" }
          }
          $notes = @"
          ## SWAPP Live 1.2.3 — Choix des fenêtres Windows (préversion)
          Le Creator Studio permet maintenant de choisir **une fenêtre ou application réellement ouverte sur Windows** (liste de fenêtres Win32, titres, actualisation). Un clic sur Prévisualiser transmet uniquement cette sélection au moteur FFmpeg pour la capture GDI. La fenêtre est vérifiée juste avant la capture : une fenêtre réduite, fermée ou impossible à identifier n'entraîne JAMAIS une capture cachée de tout le bureau.

          La même interface conserve le RTMP et la clé SWAPP récupérés automatiquement, les sources OBS externes, l'aperçu HLS et les commandes de publication/arrêt du direct.
          
          **Correctifs :** après l'erreur FFmpeg DirectX « Output parameters changed », le studio tente GDI automatiquement ; l'option NVENC incompatible sc_threshold a été supprimée. Les commandes copier, afficher/masquer la clé, déconnexion, réparation du relais et arrêt du direct ont été raccordées aux API du site local.
          
          **Validation :** tests du parcours connexion → choix de fenêtre → aperçu → direct → arrêt, résolution sécurisée des fenêtres Win32, lancement réel du script PowerShell sur runner Windows et vérification du script dans le paquet Electron.
          
          **Limites :** la capture d'une fenêtre utilise le gdigrab par titre de FFmpeg 6.1 : certains jeux 3D accélérés ou plein écran exclusif peuvent fournir une image noire. Le moteur Game Capture de libobs reste source-only : il n'est PAS inclus dans cet EXE. Certains jeux plein écran, dont ceux protégés par anti-cheat, peuvent rester noirs même en GDI. Les scènes multicouches, overlays et chat embarqué ne sont pas encore implémentés. Version non encore validée sur le PC de l'utilisateur.
          
          Construite et contrôlée sur GitHub Actions Windows ; test de jeu réel côté utilisateur encore nécessaire.
          "@
          gh release create $tag $portable $setup --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "SWAPP Live 1.2.3 — Choix de fenêtre Windows (préversion)" --prerelease --notes "$notes"

      - name: Require validated native libobs runtime before public release
        if: ${{ inputs.publish_release == true }}
        shell: pwsh
        run: |
          if (!(Test-Path "local-agent/libobs-runtime/swapp-libobs-host.exe")) {
            throw "No native libobs executable staged. Public release blocked to avoid misleading users."
          }
          if (!(Test-Path "local-agent/libobs-runtime/GPL-2.0-LICENSE.txt")) {
            throw "Missing libobs GPL notice. Public release blocked."
          }

      - name: Publish installers as public GitHub Release (manual opt-in only)
        if: ${{ inputs.publish_release == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "swapp-live-windows-v1.2.3"
          $files = @(Get-ChildItem "local-agent/dist" -File -Filter "*.exe" | ForEach-Object { $_.FullName })
          if ($files.Count -lt 2) { throw "SWAPP Live installer and portable executable were not both produced" }
          $notes = "SWAPP Live Windows 1.2.3 : un seul Creator Studio (ancienne interface OBS supprimée), URL RTMP et clé de chaîne récupérées automatiquement, source OBS externe détectée dans le studio, commandes de direct/arrêt/réparation intégrées. Récupération après écran DXGI Output changed par GDI. Game Capture libobs non compilé, jeux protégés non garantis : préversion Windows."
          gh release create $tag $files --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "SWAPP Live Windows v1.2.3" --notes $notes

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SWAPP Live — lecteur</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#050507;color:#fff}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507}
#stage{height:100%;display:flex;flex-direction:column;background:#050507}.media{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:cover;background:#000;cursor:pointer}video.fit{object-fit:contain}
#state{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#000d;color:#c9cbd3;font-size:14px;padding:24px}
#state[hidden],.audioHint[hidden]{display:none}.audioHint{position:absolute;z-index:4;top:12px;left:12px;max-width:80%;padding:9px 12px;border-radius:5px;background:#521b2c;color:#fff;font-size:12px}
.toolbar{height:48px;min-height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;background:#0a0a0e;border-top:1px solid #23232b}
.toolbar button{padding:0;min-height:34px;width:35px;flex:none;border:0;border-radius:4px;background:transparent;color:#f6f6f8;font-size:17px;cursor:pointer}
.toolbar button:hover,.toolbar button:focus-visible{background:#ffffff1a;outline:none}.toolbar button:disabled{opacity:.35;cursor:default}
.toolbar .live{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.05em;color:#92929e;white-space:nowrap}
.toolbar .live.playing{color:#ff475e}.dot{height:6px;width:6px;border-radius:50%;background:currentColor}
.toolbar .live.paused{color:#dfb45d}.toolbar .live.stopped{color:#92929e}
#volume{width:64px;accent-color:#ddd;cursor:pointer}.flex{flex:1}.label-long{display:none}#fit{font-size:10px;width:auto;padding:0 7px;color:#bbb}
@media(max-width:460px){.toolbar{gap:4px;padding:0 7px}.toolbar button{width:29px}#volume{width:42px}#fit{display:none}}
</style>
</head>
<body>
<div id="stage">
 <div class="media">
  <video id="video" autoplay muted playsinline aria-label="Diffusion SWAPP en direct"></video>
  <div id="state" role="status" aria-live="polite">Connexion au direct…</div>
  <div id="audioHint" class="audioHint" role="status" aria-live="polite" hidden></div>
 </div>
 <div class="toolbar" role="group" aria-label="Commandes du lecteur SWAPP">
  <span id="liveStatus" class="live"><span class="dot"></span>LIVE</span>
  <button id="play" type="button" aria-label="Lire ou reprendre le direct">▶</button>
  <button id="pause" type="button" aria-label="Mettre le direct en pause">⏸</button>
  <button id="stop" type="button" aria-label="Arrêter la lecture sans arrêter le diffuseur">■</button>
  <button id="live" type="button" aria-label="Revenir à la diffusion en direct">↪</button>
  <button id="audio" type="button" aria-label="Activer le son" aria-pressed="false">🔇</button>
  <input id="volume" type="range" min="0" max="1" value="0.8" step="0.05" aria-label="Volume du direct">
  <span class="flex"></span>
  <button id="fit" type="button" aria-label="Afficher toute l'image sans recadrage" aria-pressed="true">Adapter</button>
  <button id="screen" type="button" aria-label="Passer en plein écran">⛶</button>
 </div>
</div>
<script src="/assets/hls.min.js" onerror="window.__swappHlsScriptFailed=true"></script>
<script>
'use strict';
const src = __SWAPP_HLS_SRC__;
const v = document.getElementById('video');
const status = document.getElementById('state');
const audio = document.getElementById('audio');
const volume = document.getElementById('volume');
const fit = document.getElementById('fit');
const screen = document.getElementById('screen');
const audioHint = document.getElementById('audioHint');
const playButton = document.getElementById('play');
const pauseButton = document.getElementById('pause');
const stopButton = document.getElementById('stop');
const liveButton = document.getElementById('live');
const liveStatus = document.getElementById('liveStatus');
let manualStop = false, userPaused = false;
let h = null;
let booted = false, lastFrameAt = Date.now(), retries = 0, restarting = false;
let lastHlsError = '';
function showFailure(label){message(label+(lastHlsError?' · '+lastHlsError:''));}
function scriptFallback(){
 if(window.Hls)return Promise.resolve(true);
 if(window.__swappHlsFallback)return window.__swappHlsFallback;
 window.__swappHlsFallback=new Promise(resolve=>{
  const js=document.createElement('script');
  js.src='https://unpkg.com/hls.js@1.6.15/dist/hls.min.js';
  js.onload=()=>resolve(Boolean(window.Hls));
  js.onerror=()=>resolve(false);
  document.head.append(js);
 });
 return window.__swappHlsFallback;
}
let desiredVolume = 0.8;
v.volume = desiredVolume;
v.muted = true; // Browsers require muted autoplay until a real viewer click.

function message(text){status.textContent=text;status.hidden=false;}
function displayVideo(){if(!manualStop&&v.readyState>=2&&v.videoWidth>0){lastFrameAt=Date.now();retries=0;everDecoded=true;status.hidden=true;playerStatus(userPaused?'paused':'playing');}}
function playerStatus(kind){
 liveStatus.classList.toggle('paused',kind==='paused');
 liveStatus.classList.toggle('stopped',kind==='stopped');
 liveStatus.innerHTML='<span class="dot"></span>'+(kind==='paused'?'EN PAUSE':kind==='stopped'?'LECTURE ARRÊTÉE':kind==='connecting'?'CONNEXION':'LIVE');
 liveStatus.classList.toggle('playing',kind==='playing');
 playButton.disabled=kind==='playing';
 pauseButton.disabled=kind!=='playing';
}
function liveEdge(){
 if(h&&Number.isFinite(h.liveSyncPosition))return h.liveSyncPosition;
 if(v.seekable.length)return Math.max(0,v.seekable.end(v.seekable.length-1)-3);
 return NaN;
}
function seekLive(){
 const edge=liveEdge();
 if(Number.isFinite(edge)){try{v.currentTime=edge}catch(_){}}
}
async function playVideo({jumpToLive=false}={}){
 const stopped=manualStop;
 manualStop=false;userPaused=false;
 if(h&&stopped)h.startLoad(-1);
 if(jumpToLive||stopped)seekLive();
 try{await v.play()}catch(_){message('Clique sur Lecture pour démarrer la vidéo.');return}
 displayVideo();
}
playButton.addEventListener('click',()=>{void playVideo()});
pauseButton.addEventListener('click',()=>{
 if(manualStop)return;
 userPaused=true;v.pause();playerStatus('paused');
});
stopButton.addEventListener('click',()=>{
 manualStop=true;userPaused=false;v.pause();
 if(h)h.stopLoad();
 message('Lecture arrêtée sur cet appareil. Le direct continue sur SWAPP.');
 playerStatus('stopped');
});
liveButton.addEventListener('click',()=>{void playVideo({jumpToLive:true})});
v.addEventListener('pause',()=>{if(!manualStop){userPaused=true;playerStatus('paused')}});
v.addEventListener('playing',()=>{if(!manualStop){userPaused=false;displayVideo()}});

function syncAudio(){
 const muted = v.muted || v.volume === 0;
 audio.innerHTML = muted ? '🔇 <span class="label-long">Activer le son</span>' : '🔊 <span class="label-long">Couper le son</span>';
 audio.setAttribute('aria-label',muted?'Activer le son':'Couper le son');
 audio.setAttribute('aria-pressed',String(!muted));
 volume.value=String(v.volume);
}
audio.addEventListener('click',()=>{
 if(v.muted || v.volume === 0){
  if(v.volume === 0)v.volume=desiredVolume||0.8;
  v.muted=false;
 }else{v.muted=true;}
 syncAudio();
 v.play().catch(()=>{});
});
volume.addEventListener('input',()=>{
 const level=Number(volume.value);
 v.volume=level;
 if(level>0){desiredVolume=level;v.muted=false;}else{v.muted=true;}
 syncAudio();
 v.play().catch(()=>{});
});
v.addEventListener('volumechange',syncAudio);
fit.addEventListener('click',()=>{
 const fitted=v.classList.toggle('fit');
 fit.textContent=fitted?'Remplir':'Adapter';
 fit.setAttribute('aria-label',fitted?'Remplir le lecteur, quitte à recadrer':'Afficher toute l’image sans recadrage');
 fit.setAttribute('aria-pressed',String(!fitted));
});
function updateFullscreen(){
 const active=!!document.fullscreenElement;
 screen.innerHTML=active?'⤢ <span class="label-long">Quitter</span>':'⛶ <span class="label-long">Plein écran</span>';
 screen.setAttribute('aria-label',active?'Quitter le plein écran':'Passer en plein écran');
}
async function toggleFullscreen(){
 try{
  if(document.fullscreenElement){await document.exitFullscreen();}
  else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}
  else {message('Le plein écran est indisponible dans ce navigateur.');}
 }catch(_){
  message('Le plein écran est bloqué par le navigateur.');
 }
}
screen.addEventListener('click',toggleFullscreen);
v.addEventListener('dblclick',toggleFullscreen);
document.addEventListener('fullscreenchange',updateFullscreen);
v.addEventListener('playing',displayVideo);
v.addEventListener('timeupdate',displayVideo);
v.addEventListener('waiting',()=>{if(!manualStop&&!userPaused)message('Chargement de la vidéo…')});
v.addEventListener('loadeddata',displayVideo);
v.addEventListener('error',()=>{if(!manualStop){failure('navigateur '+(v.error?.code||'erreur média'));restart()}});

// No separate playlist preflight: the player itself must own its network requests.
// The old preflight could reject a healthy broadcast and block HLS forever.
let booting=false, everDecoded=false, lastFailure='', startedAt=0, hlsStartedAt=0;
function failure(reason){
 lastFailure=String(reason||'erreur inconnue').slice(0,150);
 message('Connexion vidéo : '+lastFailure);
}
function restart(){
 if(restarting || manualStop)return;
 restarting=true;booted=false;booting=false;everDecoded=false;retries++;
 playerStatus('connecting');
 if(h){try{h.destroy()}catch(_){} h=null}
 v.pause();v.removeAttribute('src');v.load();
 message(retries>4?'Le direct ne démarre pas. Nouvelle tentative…':'Reconnexion vidéo…');
 const delay=Math.min(8000,1500+retries*800);
 setTimeout(()=>{restarting=false;boot()},delay);
}
async function boot(){
 if(booted || booting || restarting || manualStop)return;
 booting=true;startedAt=Date.now();
 playerStatus('connecting');
 try{
  const source=src+(src.includes('?')?'&':'?')+'t='+Date.now();
  // A nonempty canPlayType(HLS) is not a reliable guarantee of native
  // MPEG-TS playback (the reported black-screen returned NotSupportedError).
  // Prefer MSE+hls.js on capable browsers, as recommended by hls.js.
  if(!window.Hls)await scriptFallback();
  if(window.Hls && Hls.isSupported()){
  h=new Hls({
   lowLatencyMode:false,liveSyncDurationCount:3,
   backBufferLength:80,maxBufferLength:25,
   manifestLoadingMaxRetry:4,levelLoadingMaxRetry:4,fragLoadingMaxRetry:4
  });
  booted=true;hlsStartedAt=Date.now();
  h.on(Hls.Events.MEDIA_ATTACHED,()=>h.loadSource(source));
  h.on(Hls.Events.MANIFEST_LOADED,()=>{
   if(!manualStop)message('Connexion au flux vidéo…');
  });
  h.on(Hls.Events.FRAG_LOADED,()=>{
   if(!manualStop)message('Chargement des images vidéo…');
  });
  h.on(Hls.Events.MANIFEST_PARSED,()=>{
   if(!manualStop&&!userPaused)void v.play().catch(e=>{
    if(e?.name==='NotAllowedError')message('Clique sur Lecture pour démarrer le direct.');
    else failure('lecture : '+String(e?.name||e?.message||'échouée'));
   });
  });
  h.on(Hls.Events.ERROR,(_ev,info)=>{
   if(!info)return;
   const response=info.response||info.networkDetails;
   const code=response?.code||response?.status||response?.statusCode||'';
   const detail=String(info.details||info.type||'erreur');
   lastHlsError=detail+(code?' (HTTP '+code+')':'');
   if(info.fatal){
    failure(lastHlsError);
    if(info.type===Hls.ErrorTypes.MEDIA_ERROR&&retries<2){
     retries++;try{h.recoverMediaError();return}catch(_){}
    }
    restart();
   }
  });
  h.attachMedia(v);
  message('Connexion au direct…');
  return;
  }
  // Safari/iOS native HLS fallback only if MediaSource+hls.js is unavailable.
  if(v.canPlayType('application/vnd.apple.mpegurl')){
   booted=true;v.src=source;
   try{await v.play()}
   catch(e){failure('lecture HLS native : '+(e?.name||'erreur navigateur'));booted=false}
   return;
  }
  failure('moteur hls.js indisponible ou navigateur incompatible');
  booted=false;
  setTimeout(()=>{booting=false;boot()},4500);
 }catch(e){
  failure('initialisation : '+String(e?.message||e));
  booted=false;
  setTimeout(()=>{booting=false;boot()},4500);
 }finally{booting=false}
}
playerStatus('connecting');
syncAudio();
boot();
setInterval(()=>{if(booted&&!manualStop&&!userPaused&&Date.now()-(everDecoded?lastFrameAt:hlsStartedAt||startedAt)>45000){failure(lastHlsError||'aucune image décodée après 45 secondes');restart()}},5000);
// Distinguish a muted browser player from an OBS stream with no audio track.
async function refreshAudioTrack(){
 if(!src.startsWith('/api/oryon/local-relay/'))return;
 try{
  const r=await fetch(src.replace(/\/(?:index|dvr)\.m3u8(?:\?.*)?$/,'/state')+'?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)return;
  const state=await r.json();
  const missing=state.active&&state.audio_track==='missing';
  audioHint.hidden=!missing;
  audioHint.textContent=missing?'OBS ne transmet aucune piste audio. Vérifie la piste 1 dans OBS.':'';
 }catch(_){}
}
refreshAudioTrack();
setInterval(refreshAudioTrack,14000);
setInterval(()=>{if(!booted&&!booting&&!restarting)boot();},7000);
</script>
</body>
</html>

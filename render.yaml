services:
  - type: web
    name: swapp-live
    env: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ORYON_LIVE_SIGNAL_TIMEOUT_MS
        value: 120000
